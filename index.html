<!DOCTYPE html>
<html lang="PT-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <div class="divison">
        <h1>Formulário de alguma coisa</h1>
    </div>

    <div>
        <form>
            <label>Informações pessoais</label>
            <fieldset>
                <label for="nome">Nome Completo</label>
                <input id="nome", type="text">
                <label for="email">E-mail</label>
                <input id="email", type="email">
                <label for="senha">Senha</label>
                <input id="senha", type="password">

                <label for="data_nasc">Data de Nascimento</label>
                <input id="data_nacs", type="date">
                <label for="curso">Qual o seu curso de computação:</label>

                <select name="curso" id="curso">
                    <option value=null>   </option>
                    <option value="cien_comp">Ciência da Computação</option>
                    <option value="eng_soft">Engenharia de Software</option>
                    <option value="eng_dados" selected>Engenharia de Dados</option>
                    <option value="ana_sist">Analise de Sistemas</option>
                </select>
                <div id="escolha">
                    <hr>
                    <div class="container">
                        <label>Sexo:</label>
                        <input type="radio" id="html" name="fav_language" value="HTML">
                        <input type="radio" id="css" name="fav_language" value="CSS">
                        <input type="radio" id="js" name="fav_language" value="JavaScript">
                    </div>
                    <div class="container2">
                        <label> </label>
                        <label for="html">Masculino</label>
                        <label for="css">Feminino</label>
                        <label for="js">Outro</label>
                    </div>
                </div>
                
                

            </fieldset>
            <label id="division">Informações Adicionais</label>
            <fieldset>
                <label for="interesses">Interesses</label>
                <input id="interesses", type="text">
                <label for="comentarios">Comentários</label>
                <input id="comentarios", type="long-text">
                <label for="foto">Adicione uma foto (opcional)</label>
                <input id="foto", type="file">
            </fieldset>
            <button type="button">Enviar</button>
        
            
        </form>
    </div>
    
    
</body>
</html>

<style>
    body{
        background-color:rgb(54, 17, 85);
        background-image: linear-gradient(to bottom right,rgb(54, 17, 85), rgb(21, 6, 32));
    }
    form{
        background-color: azure;
        text-align: center;
        max-width: 45%;
        margin: auto;
        border: 1px solid;
        border-radius: 12px;
        border-color: rgb(119, 114, 114);
        
    }
    fieldset{
        padding: 2px;
        text-align: left;
        margin: auto;
        max-width: 95%;
        border: 2px solid;
        border-radius: 12px;
        border-color: rgb(94, 145, 145);
        margin-bottom: 5px;
    }
    input, select{
        padding: 3px;
        min-width:max-content;
        margin: 6px 0;
        box-sizing: border-box;
        background-color: rgb(140, 140, 150);
        width: 100%;
    }
    h1{
        text-align: center;
        color: white;
        text-shadow: 3px 2px 1px rgb(24, 165, 165);
    }
    .division{
        margin: auto;
        color: brown;
        margin-top: 20px;
    }
    .container{
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
    }
    .container2{
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        text-align: center;
    }
    #foto{
        width: 100%;
    }
    button{
        margin-bottom: 5px;
    }
    input:focus {
        border: 2px solid #802bc5;
        outline: none;
        box-shadow: 0 0 5px rgba(0, 86, 179, 0.5);
    }
    select:focus {
        border: 2px solid #802bc5;
        outline: none;
        box-shadow: 0 0 5px rgba(0, 86, 179, 0.5);
    }
    select:hover {
        background-color: #9843dd;
        color: #ffffff;
        cursor: pointer;
    }
    input[type='radio'] {
        accent-color: #9843dd; /* comando pego no google */
        transform: scale(1.2);
    }
    button:focus {
        border: 2px solid #802bc5;
        outline: none;
        box-shadow: 0 0 5px rgba(0, 86, 179, 0.5);
    }
    button:hover {
        background-color: #9843dd;
        color: #ffffff;
        cursor: pointer;
    }

</style>
